name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's runs share a group, so a new push cancels the last;
  # every other run gets its commit's own group.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  # The toolchain OVCS pins in its mise.toml, which runs this library.
  OTP_VERSION: "28.4.1"
  ELIXIR_VERSION: "1.19.5"

jobs:
  check:
    name: Elixir · format · compile · espec · credo · audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      - name: Audit deps
        # Fails on any locked package with a security advisory or a retirement.
        run: mix hex.audit

      - name: Format
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      # cantastic's Application requires a configured CAN topology to
      # boot (see Cantastic.ConfigurationStore); --no-start skips it
      # for tests that exercise pure functions. coveralls runs the espec
      # suite under cover and prints a coverage summary in the log.
      - name: Test
        run: mix coveralls --no-start

      - name: Credo
        run: mix credo
